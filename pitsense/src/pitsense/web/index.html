<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<title>PitSense Pit Wall</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="tab-tower">
<header>
  <div class="brand">PIT<span>SENSE</span></div>
  <div id="title" class="hd">--</div>
  <div id="lap" class="hd big">LAP --</div>
  <div id="clock" class="hd">--</div>
  <div id="status" class="status green">GREEN</div>
  <div id="wx" class="hd">--</div>
  <div id="loss" class="hd">--</div>
  <select id="teamsel" class="teamsel" title="your team on this screen (saved in this browser)" aria-label="focus team"></select>
  <div id="mode" class="chip">--</div>
  <div id="conn" class="chip off">connecting</div>
</header>
<div id="callbar" class="callbar" aria-live="polite"></div>
<nav id="tabs" class="tabs" aria-label="sections">
  <button data-tab="tower" class="on">Tower</button><button data-tab="map">Map</button><button data-tab="radio">Radio</button><button data-tab="team">Team</button><button data-tab="alerts">Alerts</button>
</nav>
<div id="warn" class="warn" hidden></div>
<main>
  <section class="panel tower" data-tab="tower">
    <h2>Timing tower <small>click a car to pin it</small></h2>
    <table id="tower">
      <thead><tr>
        <th>P</th><th>CAR</th><th>GAP</th><th class="x">INT</th><th>TYRE</th><th class="x">STOPS</th>
        <th class="x">LAST</th><th>BOX NOW</th><th class="x">PIT %</th><th>CALL</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div id="out" class="out"></div>
  </section>
  <aside>
    <section class="panel map" data-tab="map"><h2>Track map <small id="mapnote"></small></h2>
      <div id="mapwrap"><svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg><div id="maptip" class="tip" hidden></div></div>
    </section>
    <section class="panel" id="qpanel" data-tab="tower" hidden><h2>Qualifying <small id="qnote"></small></h2><div id="qsum"></div>
      <table id="qtab"><thead><tr><th>P</th><th>CAR</th><th>BEST</th><th>TO CUT</th><th>KO %</th><th>SEND</th></tr></thead><tbody></tbody></table></section>
    <section class="panel" data-tab="radio"><h2>Pit wall radio <small>our cars</small><button id="radiobtn" onclick="flipRadio(this)">radio off</button></h2><div id="convo" class="convo"></div>
      <form id="askform" class="askform" autocomplete="off">
        <select id="askcar" title="which car to ask about" hidden></select>
        <input id="asktext" type="text" maxlength="300" placeholder="Ask the pit wall: what if we box now? gap ahead? safety car next lap?" aria-label="question">
        <button id="askbtn" type="submit">Ask</button>
        <button id="micbtn" type="button" title="hold to talk" aria-label="hold to talk">&#127908;</button>
      </form>
      <div id="askstat" class="askstat" aria-live="polite"></div></section>
    <section class="panel" data-tab="team"><h2>Our cars <small id="focusnote"></small></h2><div id="focus"></div></section>
    <section class="panel" data-tab="alerts"><h2>Alerts</h2><div id="alerts"></div></section>
    <section class="panel" data-tab="alerts"><h2>Race control</h2><div id="rc"></div></section>
  </aside>
</main>
<script src="/app.js"></script>
</body>
</html>
