<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PitSense Pit Wall</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">PIT<span>SENSE</span></div>
  <div id="title" class="hd">--</div>
  <div id="lap" class="hd big">LAP --</div>
  <div id="clock" class="hd">--</div>
  <div id="status" class="status green">GREEN</div>
  <div id="wx" class="hd">--</div>
  <div id="loss" class="hd">--</div>
  <div id="mode" class="chip">--</div>
  <div id="conn" class="chip off">connecting</div>
</header>
<div id="warn" class="warn" hidden></div>
<main>
  <section class="panel tower">
    <h2>Timing tower <small>click a car to pin it</small></h2>
    <table id="tower">
      <thead><tr>
        <th>P</th><th>CAR</th><th>GAP</th><th>INT</th><th>TYRE</th><th>STOPS</th>
        <th>LAST</th><th>BOX NOW</th><th>PIT %</th><th>CALL</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div id="out" class="out"></div>
  </section>
  <aside>
    <section class="panel map"><h2>Track map <small id="mapnote"></small></h2>
      <div id="mapwrap"><svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg><div id="maptip" class="tip" hidden></div></div>
    </section>
    <section class="panel" id="qpanel" hidden><h2>Qualifying <small id="qnote"></small></h2><div id="qsum"></div>
      <table id="qtab"><thead><tr><th>P</th><th>CAR</th><th>BEST</th><th>TO CUT</th><th>KO %</th><th>SEND</th></tr></thead><tbody></tbody></table></section>
    <section class="panel"><h2>Pit wall radio <small>our cars</small><button id="radiobtn" onclick="flipRadio(this)">radio off</button></h2><div id="convo" class="convo"></div></section>
    <section class="panel"><h2>Our cars <small id="focusnote"></small></h2><div id="focus"></div></section>
    <section class="panel"><h2>Alerts</h2><div id="alerts"></div></section>
    <section class="panel"><h2>Race control</h2><div id="rc"></div></section>
  </aside>
</main>
<script src="/app.js"></script>
</body>
</html>
